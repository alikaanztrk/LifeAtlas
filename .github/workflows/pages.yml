name: Prepare or publish Pages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lifeatlas-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run scan:artifacts
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: inputs.publish
        with:
          path: dist

  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Check the configured base path
        env:
          LIFEATLAS_PAGES_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$LIFEATLAS_PAGES_PATH" != "/LifeAtlas" ]; then
            echo "The configured Pages path must match the verified /LifeAtlas/ build."
            exit 1
          fi
      - name: Publish verified static files
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
